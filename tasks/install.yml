---
- name: Ensure pump-it-up-tracker paths exist
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: "0750"
    owner: "{{ piu_tracker_uid }}"
    group: "{{ piu_tracker_gid }}"
  with_items:
    - "{{ piu_tracker_base_path }}"
    - "{{ piu_tracker_config_path }}"
    - "{{ piu_tracker_data_path }}"

- name: Ensure pump-it-up-tracker support files installed
  ansible.builtin.template:
    src: "{{ role_path }}/templates/{{ item }}.j2"
    dest: "{{ piu_tracker_base_path }}/{{ item }}"
    mode: "0640"
    owner: "{{ piu_tracker_uid }}"
    group: "{{ piu_tracker_gid }}"
  with_items:
    - env
    - labels
  register: piu_tracker_support_files_result

# The image is pulled before the data file is installed, because the data file
# is validated with the image's own `validate` command.
- name: Ensure pump-it-up-tracker container image is pulled via community.docker.docker_image_pull
  when: devture_systemd_docker_base_container_image_pull_method == 'ansible-module'
  community.docker.docker_image_pull:
    name: "{{ piu_tracker_container_image }}"
    pull: always
  register: piu_tracker_container_image_pull_result_ansible_module
  retries: "{{ devture_playbook_help_container_retries_count }}"
  delay: "{{ devture_playbook_help_container_retries_delay }}"
  until: piu_tracker_container_image_pull_result_ansible_module is not failed

- name: Ensure pump-it-up-tracker container image is pulled via ansible.builtin.command
  when: devture_systemd_docker_base_container_image_pull_method == 'command'
  ansible.builtin.command:
    cmd: "{{ devture_systemd_docker_base_host_command_docker }} pull {{ piu_tracker_container_image }}"
  register: piu_tracker_container_image_pull_result_command
  retries: "{{ devture_playbook_help_container_retries_count }}"
  delay: "{{ devture_playbook_help_container_retries_delay }}"
  until: piu_tracker_container_image_pull_result_command is not failed
  changed_when: "'Downloaded newer image' in piu_tracker_container_image_pull_result_command.stdout"

# With validation enabled, a data file with a mistake in it fails here and
# lists every problem, while the file already in place (and the running
# service) stay as they were.
- name: Ensure pump-it-up-tracker data file is installed
  ansible.builtin.copy:
    content: "{{ piu_tracker_data | to_nice_json(indent=2) }}\n"
    dest: "{{ piu_tracker_config_path }}/tracker.json"
    mode: "0640"
    owner: "{{ piu_tracker_uid }}"
    group: "{{ piu_tracker_gid }}"
    validate: "{{ piu_tracker_data_validation_command if piu_tracker_data_validation_enabled | bool else omit }}"
  register: piu_tracker_data_file_result

- name: Ensure pump-it-up-tracker container network is created via community.docker.docker_network
  when: devture_systemd_docker_base_container_network_creation_method == 'ansible-module'
  community.docker.docker_network:
    enable_ipv6: "{{ devture_systemd_docker_base_ipv6_enabled }}"
    name: "{{ piu_tracker_container_network }}"
    driver: bridge
    driver_options: "{{ devture_systemd_docker_base_container_networks_driver_options }}"
  register: piu_tracker_network_creation_result

- name: Ensure pump-it-up-tracker container network is created via ansible.builtin.command
  when: devture_systemd_docker_base_container_network_creation_method == 'command'
  ansible.builtin.command:
    cmd: >-
      {{ devture_systemd_docker_base_host_command_docker }} network create
      {% if devture_systemd_docker_base_ipv6_enabled %}--ipv6{% endif %}
      {{ devture_systemd_docker_base_container_networks_driver_options_string }}
      {{ piu_tracker_container_network }}
  register: piu_tracker_network_creation_result
  changed_when: piu_tracker_network_creation_result.rc == 0
  failed_when: piu_tracker_network_creation_result.rc != 0 and 'already exists' not in piu_tracker_network_creation_result.stderr

- name: Ensure pump-it-up-tracker systemd service is present
  ansible.builtin.template:
    src: "{{ role_path }}/templates/systemd/piu-tracker.service.j2"
    dest: "{{ devture_systemd_docker_base_systemd_path }}/{{ piu_tracker_identifier }}.service"
    mode: "0644"
  register: piu_tracker_systemd_service_result

# The application reads its data file once, at startup, so a changed data file
# needs a restart as much as a changed image does.
- name: Determine whether pump-it-up-tracker needs a restart
  ansible.builtin.set_fact:
    piu_tracker_restart_necessary: >-
      {{
        piu_tracker_support_files_result.changed | default(false)
        or piu_tracker_data_file_result.changed | default(false)
        or piu_tracker_systemd_service_result.changed | default(false)
        or piu_tracker_container_image_pull_result_ansible_module.changed | default(false)
        or piu_tracker_container_image_pull_result_command.changed | default(false)
      }}
